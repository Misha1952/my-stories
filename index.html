<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши истории</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .story-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .story-btn {
            background-color: #ffffff;
            color: #2980b9;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s ease;
            border: 2px solid #3498db;
        }
        .story-btn:hover {
            background-color: #3498db;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <h1>📚 Наши истории</h1>
    
    <div class="story-list">
        <!-- Ссылка на первую историю (замените точное имя файла, если оно отличается) -->
        <a class="story-btn" href="Жираф маркет.html">Жираф маркет</a>
        
        <!-- Ссылка на вторую историю -->
        <a class="story-btn" href="Мои друзья в джунглях.html">Мои друзья в джунглях</a>
        
        <!-- Ссылка на третью историю -->
        <a class="story-btn" href="трое на необитаемом острове.html">Трое на необитаемом острове</a>
    </div>

</body>
</html>
